[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ml-rf-quality-model"
version = "0.1.0"
description = "CS523 PSWS RF quality assessment: ingestion, feature extraction, and five ML baselines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "requests>=2.31",
    "pandas>=2.1",
]

[project.optional-dependencies]
xgboost = ["xgboost>=2.0"]
rocket = ["aeon>=1.3,<2"]
inception = ["torch>=2.2", "tsai>=0.3"]
autoencoder = ["torch>=2.2"]
drf = ["digital-rf>=2.6"]
dask = ["dask[array]>=2024.1"]
models = ["xgboost>=2.0", "aeon>=1.3,<2", "torch>=2.2", "tsai>=0.3"]
all = ["xgboost>=2.0", "aeon>=1.3,<2", "torch>=2.2", "tsai>=0.3", "digital-rf>=2.6", "dask[array]>=2024.1"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
rf-quality = "rf_quality.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rf_quality"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
